<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 15px; text-align: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.5rem; color: #38bdf8; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
        .user { align-self: flex-end; background-color: #0284c7; color: white; border-bottom-right-radius: 2px; }
        .model { align-self: flex-start; background-color: #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
        #input-box { padding: 15px; background-color: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; background-color: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; outline: none; }
        button { padding: 12px 20px; background-color: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>⚡ Zenith AI</h1>
    </header>

    <div id="chat-box"></div>

    <div id="input-box">
        <input type="text" id="user-input" placeholder="Nhập tin nhắn cho Zenith AI..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');

        async function loadHistory() {
            try {
                const res = await fetch('/get_history');
                const data = await res.json();
                if (data.history) {
                    data.history.forEach(msg => appendMessage(msg.role, msg.content));
                }
            } catch (err) {
                console.error("Lỗi tải lịch sử:", err);
            }
        }

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await res.json();
                if (data.reply) {
                    appendMessage('model', data.reply);
                } else {
                    appendMessage('model', 'Đã có lỗi xảy ra.');
                }
            } catch (err) {
                appendMessage('model', 'Lỗi kết nối máy chủ!');
            }
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
